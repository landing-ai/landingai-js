name: TSC
on:
  # No path filter: this check is required on main, and a filtered-out run
  # never reports, which leaves the PR unable to merge.
  pull_request:

jobs:
  ci-tsc:
    runs-on: ubuntu-latest

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: "Use NodeJS 18"
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'

    - name: "Install dependencies"
      run: |
        yarn install

    - name: "TSC"
      run: |
        yarn tsc
